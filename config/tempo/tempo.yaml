multitenancy_enabled: false

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  # Flush trace data to the metrics generator as blocks become available so
  # TraceQL metrics queries (e.g. "Best Score Over Time") can see recent data.
  flush_check_period: 10s

metrics_generator:
  processor:
    local_blocks:
      # Enables TraceQL metric queries (rate/max_over_time/etc.) against
      # recent trace data without needing an external metrics store.
      flush_to_storage: true
  storage:
    path: /tmp/tempo/generator/wal
    remote_write_flush_deadline: 1m
  traces_storage:
    path: /tmp/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks]

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal
