multitenancy_enabled: false

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

# Tempo 3.0 removed the `ingester` block, the `local-blocks` processor and
# `metrics_generator.traces_storage`. TraceQL metrics queries (e.g. the
# "Best Score Over Time" panel) are now served natively by the live-store
# against recent trace data, so no processor needs to be enabled for them.
#
# This block is inert until a processor (span-metrics, service-graphs) is
# enabled via `overrides.defaults.metrics_generator.processors`; it is kept
# so remote-write settings are already in place if one is turned on.
metrics_generator:
  storage:
    path: /tmp/tempo/generator/wal
    remote_write_flush_deadline: 1m

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal
